<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre-se para participar das ações da Solidariedade em Ação.">
    <title>Cadastro - Solidariedade em Ação</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="menu">
            <a href="index.html" class="logo">Solidariedade em Ação</a>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Participe</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="pagina">
            <h1>Quero participar</h1>
            <p>Preencha o formulário para fazer parte das nossas ações.</p>

            <form id="formulario" class="formulario">
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            required
                            minlength="3"
                        >
                    </div>

                    <div class="linha">
                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input
                                type="text"
                                id="cpf"
                                name="cpf"
                                placeholder="000.000.000-00"
                                inputmode="numeric"
                                maxlength="14"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="data-nascimento">Data de nascimento</label>
                            <input
                                type="date"
                                id="data-nascimento"
                                name="data-nascimento"
                                required
                            >
                        </div>
                    </div>

                    <div class="linha">
                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="seuemail@email.com"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="telefone">Telefone</label>
                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="(11) 99999-9999"
                                inputmode="numeric"
                                maxlength="15"
                                required
                            >
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <div class="linha">
                        <div class="campo">
                            <label for="cep">CEP</label>
                            <input
                                type="text"
                                id="cep"
                                name="cep"
                                placeholder="00000-000"
                                inputmode="numeric"
                                maxlength="9"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="numero">Número</label>
                            <input
                                type="number"
                                id="numero"
                                name="numero"
                                min="1"
                                placeholder="Número"
                                required
                            >
                        </div>
                    </div>

                    <div class="campo">
                        <label for="endereco">Endereço</label>
                        <input
                            type="text"
                            id="endereco"
                            name="endereco"
                            placeholder="Rua, avenida..."
                            required
                        >
                    </div>

                    <div class="linha">
                        <div class="campo">
                            <label for="cidade">Cidade</label>
                            <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                placeholder="Digite sua cidade"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="estado">Estado</label>
                            <select id="estado" name="estado" required>
                                <option value="">UF</option>
                                <option value="AC">AC</option>
                                <option value="AL">AL</option>
                                <option value="AP">AP</option>
                                <option value="AM">AM</option>
                                <option value="BA">BA</option>
                                <option value="CE">CE</option>
                                <option value="DF">DF</option>
                                <option value="ES">ES</option>
                                <option value="GO">GO</option>
                                <option value="MA">MA</option>
                                <option value="MT">MT</option>
                                <option value="MS">MS</option>
                                <option value="MG">MG</option>
                                <option value="PA">PA</option>
                                <option value="PB">PB</option>
                                <option value="PR">PR</option>
                                <option value="PE">PE</option>
                                <option value="PI">PI</option>
                                <option value="RJ">RJ</option>
                                <option value="RN">RN</option>
                                <option value="RS">RS</option>
                                <option value="RO">RO</option>
                                <option value="RR">RR</option>
                                <option value="SC">SC</option>
                                <option value="SP">SP</option>
                                <option value="SE">SE</option>
                                <option value="TO">TO</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Como deseja participar?</legend>

                    <div class="campo">
                        <label for="participacao">Tipo de participação</label>
                        <select id="participacao" name="participacao" required>
                            <option value="">Selecione uma opção</option>
                            <option value="voluntario">Voluntário</option>
                            <option value="doador">Doador</option>
                            <option value="ambos">Voluntário e doador</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="mensagem">Conte como gostaria de ajudar</label>
                        <textarea
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                            minlength="10"
                            placeholder="Digite sua mensagem"
                            required
                        ></textarea>
                    </div>
                </fieldset>

                <button type="submit" class="botao">Enviar cadastro</button>
                <p id="mensagem-formulario" class="mensagem-formulario"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Solidariedade em Ação. Todos os direitos reservados.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
